[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scdrc"
version = "0.1.0"
description = "Supply Chain Disruption Response Coordinator - Multi-Agent Blackboard System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ResilienceHub Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "streamlit>=1.33.0"
]

[project.scripts]
scdrc = "scdrc.cli:main"

[tool.pytest.ini_options]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: marks tests as requiring live Groq API access (deselect with '-m \"not live\"')"
]
