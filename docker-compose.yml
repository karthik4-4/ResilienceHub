version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scdrc-api
    command: python -m scdrc.cli serve --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - SCDRC_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scdrc-ui
    command: streamlit run src/scdrc/ui/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - SCDRC_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    depends_on:
      - api
    restart: unless-stopped
